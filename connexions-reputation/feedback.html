<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share your feedback</title>
<link rel="icon" href="data:,">
<style>
  :root{--c:#4f46e5;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#f1f5f9;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:28px 14px}
  button,textarea,input{font:inherit;color:inherit}
  .card{width:min(560px,100%);background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(15,23,42,.08);overflow:hidden;align-self:flex-start}
  .band{height:8px;background:var(--c)}
  .head{padding:26px 26px 6px;text-align:center}
  .logo{max-width:180px;max-height:70px;object-fit:contain;display:block;margin:0 auto 12px}
  .mono{width:56px;height:56px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 12px}
  .biz{font-weight:700;color:var(--ink2)}
  .body{padding:8px 26px 28px;text-align:center}
  h1{font-size:22px;line-height:1.3;margin:10px 0 8px;letter-spacing:-.01em}
  p{margin:0 0 14px;color:var(--ink2)}
  .nps{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin:18px 0 6px}
  .nps button{aspect-ratio:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-weight:700;cursor:pointer;padding:0;min-width:0}
  .nps button:hover,.nps button:focus-visible{border-color:var(--c);color:var(--c);outline:0}
  .scale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
  .starrow{display:flex;justify-content:center;gap:6px;margin:16px 0 4px}
  .starrow button{border:0;background:none;font-size:44px;line-height:1;color:#d6dbe3;cursor:pointer;padding:2px}
  .starrow button.on{color:#f59e0b}
  textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;text-align:left}
  textarea:focus,input:focus{outline:2px solid var(--c);outline-offset:-1px;border-color:transparent}
  input[type=text]{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);margin-top:10px;padding:0 14px}
  .btn.primary{background:var(--c);border-color:var(--c);color:#fff}
  .btn:hover{filter:brightness(.97)}
  .site-dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none}
  .quote{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;white-space:pre-wrap;color:var(--ink2);margin:6px 0 4px}
  .small{font-size:13px;color:var(--muted)}
  .minor{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .minor .btn{min-height:40px;font-size:14px;font-weight:600}
  .foot{text-align:center;font-size:12px;color:var(--muted);padding:0 0 18px}
  .err{padding:40px 26px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<main class="card" id="card"></main>

<script>
(function () {
  'use strict';
  var INBOX = 'cxr:inbox';
  var SITES = {
    google: ['Google', '#4285f4', 'G'], facebook: ['Facebook', '#1877f2', 'f'], yelp: ['Yelp', '#d32323', 'y'],
    tripadvisor: ['Tripadvisor', '#00aa6c', 't'], bbb: ['BBB', '#005a78', 'B'], other: ['Review us', '#64748b', '★']
  };
  var card = document.getElementById('card');
  var P, state;

  function dec(s) {
    try {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return JSON.parse(decodeURIComponent(escape(atob(s))));
    } catch (e) { return null; }
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fill(t) { return String(t || '').replace(/\{business\}/g, P.n || 'us').replace(/\{first_name\}/g, P.fn || ''); }
  function uid() { return 'f' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }

  // Report to the dashboard (same-origin inbox) and to the webhook, if one is set.
  function emit(type, extra) {
    if (P.pv) return;
    var evt = { id: uid(), type: type, fid: state.fid, c: P.c || null, r: P.r || null, at: new Date().toISOString(), scale: P.t };
    for (var k in extra) evt[k] = extra[k];
    try {
      var box = JSON.parse(localStorage.getItem(INBOX) || '[]');
      box.push(evt);
      localStorage.setItem(INBOX, JSON.stringify(box));
    } catch (e) { /* storage blocked: webhook still gets it */ }
    if (P.w) {
      try { fetch(P.w, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ business: P.n }, evt)) }); } catch (e) {}
    }
  }

  function positive(r) { return r >= Number(P.th); }

  function sites(minor) {
    var links = (P.links || []).filter(function (l) { return l[1]; });
    if (!links.length) return minor ? '' : '<p class="small">Thank you!</p>';
    var html = links.map(function (l) {
      var s = SITES[l[0]] || SITES.other;
      return '<a class="btn" data-site="' + esc(l[0]) + '" href="' + esc(l[1]) + '" target="_blank" rel="noopener">' +
        '<span class="site-dot" style="background:' + s[1] + '">' + esc(s[2]) + '</span>' +
        (l[0] === 'other' ? 'Leave a review' : 'Review us on ' + esc(s[0])) + '</a>';
    }).join('');
    return minor ? '<div class="minor"><p class="small">You can also leave a public review:</p>' + html + '</div>' : html;
  }

  function header() {
    var logo = P.l ? '<img class="logo" src="' + esc(P.l) + '" alt="' + esc(P.n) + '">' :
      '<div class="mono">' + esc((P.n || '?').trim().charAt(0).toUpperCase()) + '</div>';
    return '<div class="band"></div><div class="head">' + logo + '<div class="biz">' + esc(P.n) + '</div></div>';
  }

  function nameField() {
    return P.fn ? '' : '<input type="text" id="who" placeholder="Your name (optional)" autocomplete="name">';
  }

  function render() {
    var cp = P.cp || {};
    var html = header() + '<div class="body">';
    var step = state.step;

    if (step === 'rate') {
      var q = fill(cp.q || (P.t === 'nps'
        ? 'How likely are you to recommend {business} to a friend or colleague?'
        : 'How would you rate your experience with {business}?'));
      html += '<h1>' + (P.fn ? 'Hi ' + esc(P.fn) + '! ' : '') + esc(q) + '</h1>';
      if (P.t === 'nps') {
        html += '<div class="nps" role="group" aria-label="Score from 0 to 10">';
        for (var i = 0; i <= 10; i++) html += '<button type="button" data-rate="' + i + '">' + i + '</button>';
        html += '</div><div class="scale"><span>Not likely</span><span>Very likely</span></div>';
      } else {
        html += '<div class="starrow" role="group" aria-label="Rating from 1 to 5 stars">';
        for (var j = 1; j <= 5; j++) html += '<button type="button" data-rate="' + j + '" aria-label="' + j + ' star' + (j > 1 ? 's' : '') + '">★</button>';
        html += '</div>';
      }
    } else if (step === 'comment') {
      html += '<h1>' + esc(fill(cp.ch || 'Tell us a bit more about your experience')) + '</h1>' +
        '<p>' + esc(fill(cp.cb || 'What stood out? Your words help us get better.')) + '</p>' +
        nameField() + '<textarea id="cmt" placeholder="Write your feedback here"></textarea>' +
        '<button class="btn primary" data-act="send">Submit feedback</button>';
    } else if (step === 'positive') {
      html += '<h1>' + esc(fill(cp.ph || 'Thank you! Would you share your experience online?')) + '</h1>' +
        '<p>' + esc(fill(cp.pb || 'Reviews help other people find {business}. It only takes a minute.')) + '</p>';
      if (state.comment) {
        html += '<p class="small">Here’s what you wrote. Copy it to paste into your review:</p>' +
          '<div class="quote">' + esc(state.comment) + '</div>' +
          '<button class="btn" data-act="copy">' + (state.copied ? 'Copied!' : 'Copy my review') + '</button>';
      }
      html += sites(false);
    } else if (step === 'negative') {
      if (state.sent) {
        html += '<h1>' + esc(fill(cp.nth || 'Thank you. A manager will follow up with you.')) + '</h1>' +
          '<p>' + esc(fill(cp.ntb || 'We read every response, and we take it seriously.')) + '</p>';
      } else {
        html += '<h1>' + esc(fill(cp.nh || 'We’re sorry we missed the mark.')) + '</h1>' +
          '<p>' + esc(fill(cp.nb || 'Please tell us what happened so we can make it right. This goes straight to our management team.')) + '</p>' +
          nameField() + '<textarea id="cmt" placeholder="What could we have done better?"></textarea>' +
          '<button class="btn primary" data-act="send">Send to management</button>';
      }
      html += sites(true); // review sites stay available to everyone (FTC review-gating guidance)
    } else if (step === 'direct') {
      html += '<h1>' + esc(fill(cp.dh || (P.fn ? 'Thanks, {first_name}! Would you leave us a review?' : 'Would you leave us a review?'))) + '</h1>' +
        '<p>' + esc(fill(cp.db || 'Your review helps other people find {business}.')) + '</p>' + sites(false);
    }
    html += '</div><div class="foot">Powered by Connexions</div>';
    card.innerHTML = html;
    if (state.preview && step === 'rate' && state.rating != null) mark(state.rating);
  }

  function mark(r) {
    var bs = card.querySelectorAll('[data-rate]');
    for (var i = 0; i < bs.length; i++) {
      var v = Number(bs[i].getAttribute('data-rate'));
      if (P.t === 'stars') bs[i].classList.toggle('on', v <= r);
      else if (v === r) { bs[i].style.background = 'var(--c)'; bs[i].style.color = '#fff'; bs[i].style.borderColor = 'var(--c)'; }
    }
  }

  function choose(r) {
    state.rating = r;
    state.positive = positive(r);
    emit('rating', { rating: r, positive: state.positive });
    mark(r);
    setTimeout(function () {
      if (P.f === 'ultimate') state.step = 'comment';
      else state.step = state.positive ? 'positive' : 'negative';
      render();
    }, P.t === 'stars' ? 250 : 120);
  }

  card.addEventListener('click', function (e) {
    var b = e.target.closest('[data-rate],[data-act],[data-site]');
    if (!b) return;
    if (b.hasAttribute('data-rate')) return choose(Number(b.getAttribute('data-rate')));
    if (b.hasAttribute('data-site')) return emit('site', { site: b.getAttribute('data-site') });
    var act = b.getAttribute('data-act');
    if (act === 'send') {
      var t = (document.getElementById('cmt').value || '').trim();
      var who = document.getElementById('who');
      state.comment = t;
      emit('comment', { comment: t, name: who ? who.value.trim() : '' });
      if (P.f === 'ultimate') state.step = state.positive ? 'positive' : 'negative';
      state.sent = state.step === 'negative';
      render();
    } else if (act === 'copy') {
      var done = function () { state.copied = true; render(); };
      if (navigator.clipboard) navigator.clipboard.writeText(state.comment).then(done, done); else done();
    }
  });

  card.addEventListener('mouseover', function (e) {
    if (P.t !== 'stars' || state.step !== 'rate') return;
    var b = e.target.closest('[data-rate]');
    if (b) mark(Number(b.getAttribute('data-rate')));
  });

  function boot() {
    P = dec(location.hash.slice(1));
    if (!P || !P.n) {
      card.innerHTML = '<div class="band"></div><div class="err">This feedback link is incomplete. Please use the full link from your message.</div>';
      return;
    }
    document.documentElement.style.setProperty('--c', P.k || '#4f46e5');
    document.title = 'Share your feedback | ' + P.n;
    state = { fid: uid(), step: P.f === 'direct' ? 'direct' : 'rate', rating: null, comment: '', preview: !!P.pv };
    if (P.pv && P.ps) {
      state.step = P.ps;
      state.rating = P.prt != null ? P.prt : null;
      if (P.ps === 'positive' && P.f === 'ultimate') state.comment = 'Our driver was early, the car was spotless, and the whole night went perfectly.';
    }
    if (!P.pv) emit('open', {});
    render();
  }

  window.addEventListener('hashchange', boot);
  boot();
})();
</script>
</body>
</html>
